name: kbdi-bench
on:
  push:
    branches: [bench/kbdi-ci]
  workflow_dispatch:

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      K: repo/benchmarks/kbdi_competitors
      KBDI_NO_CPU_WORKAROUND: "1"  # the generic-CPU numba workaround is for Snapdragon only
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: bench-src
      - uses: actions/checkout@v4
        with:
          repository: monocongo/climate_indices
          ref: main
          path: repo
          lfs: false
      - uses: actions/checkout@v4
        with:
          repository: mclainv/climate_indices
          ref: perf/kbdi-fast-path
          path: fast
          lfs: false
      - name: Hardware
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|Core|Socket|MHz|Flags" | cut -c1-200
          free -g
          echo "THP enabled: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
          echo "THP defrag:  $(cat /sys/kernel/mm/transparent_hugepage/defrag)"
          echo "THREADS=$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Stage harnesses and inputs
        run: |
          mkdir -p "$K"
          cp -r bench-src/bench/. "$K/"
          python -m venv venv && venv/bin/pip install -q numpy==2.4.6
          venv/bin/python "$K/make_inputs.py"
          ls "$K/data"
      - name: Build stage-2 prototypes
        run: |
          # default target, as a portable wheel ships it
          cargo build --release --manifest-path "$K/rust_fast/Cargo.toml" --target-dir build
          cargo build --release --manifest-path "$K/rust_fast/Cargo.toml" --target-dir build-mi --features mimalloc
          echo "BINS=build build-mi" >> "$GITHUB_ENV"
      - name: Build AVX2 prototypes (x86 only)
        if: runner.arch == 'X64'
        env:
          # x86-64-v3 = AVX2 (+FMA/BMI); the kernel has no mul_add and Rust never
          # contracts mul+add, so the bits match the baseline build; this is the
          # ceiling of runtime AVX2 dispatch
          RUSTFLAGS: -C target-cpu=x86-64-v3
        run: |
          cargo build --release --manifest-path "$K/rust_fast/Cargo.toml" --target-dir build-v3
          cargo build --release --manifest-path "$K/rust_fast/Cargo.toml" --target-dir build-v3-mi --features mimalloc
          echo "ymm instructions: base $(objdump -d build/release/kbdi-bench-fast | grep -c ymm), v3 $(objdump -d build-v3/release/kbdi-bench-fast | grep -c ymm)"
          echo "BINS=build build-mi build-v3 build-v3-mi" >> "$GITHUB_ENV"
      - name: Install xclim
        run: |
          venv/bin/pip install -q xclim==0.62.0 numba==0.68.0 llvmlite==0.50.0 numpy==2.4.6 xarray==2026.9.0 pandas==3.0.6 scipy==1.18.1 dask==2026.8.0
          venv/bin/python -m numba -s | grep -iE "svml|cpu name|cpu features" || true
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build competitors (pinned as on the laptop)
        run: |
          W="$GITHUB_WORKSPACE"
          git clone -q https://github.com/alpineworks/firewx src/firewx
          git -C src/firewx checkout -q 0439036ae81c29d11c6837c7d083666add5a37a0
          (cd "$K/firewx" && go mod edit -replace "alpineworks.io/firewx=$W/src/firewx" -replace "alpineworks.io/firewx/nfdrs=$W/src/firewx/nfdrs" && CGO_ENABLED=0 go build -o "$W/bin/firewx" .)
          git clone -q https://github.com/firelab/NFDRS4 src/NFDRS4
          git -C src/NFDRS4 checkout -q 69d9bab727174371950d011e6af0ab00ca837cf1
          cmake -S "$K/nfdrs4" -B build-nfdrs4 -DCMAKE_BUILD_TYPE=Release -DNFDRS4_SRC="$W/src/NFDRS4" > /dev/null
          cmake --build build-nfdrs4 --target bench -j "$(nproc)" > /dev/null
          # the shipped kernel (monocongo main), the old bar on the graphics
          cargo build --release --manifest-path "$K/climate_indices_rust/Cargo.toml" --target-dir build-ci
          venv/bin/pip install -q xarray-spatial==0.10.19
          # climate_indices with its Rust extension: the release (main) and the fast-path branch
          for src in repo fast; do
            python -m venv "vci-$src" && "vci-$src/bin/pip" install -q maturin dask
            (cd "$src" && "$W/vci-$src/bin/maturin" build --release --interpreter "$W/vci-$src/bin/python" --out "$W/dist-$src" > /dev/null)
            "vci-$src/bin/pip" install -q "$W"/dist-$src/*.whl
            "vci-$src/bin/python" -c "import climate_indices, climate_indices._native as n; print('$src', climate_indices.__version__, n.__file__)"
          done
          go version; c++ --version | head -1
      - name: Run
        run: |
          run_xclim() {  # label, then harness args
            label=$1; shift
            venv/bin/python "$K/xclim/harness.py" "$@" --timings "out-$label.jsonl" 2>&1 | tail -1 | sed "s/^/[$label] /"
          }
          fast() {  # build dir, workload, variant, [threads]
            "$1/release/kbdi-bench-fast" --workload "$K/data/$2" --variant "$3" --threads "${4:-1}" --timings "out-$1.jsonl" 2>&1 | tail -1 | sed "s/^/[$1] /"
          }
          for w in station_1825 station_10958; do
            run_xclim plain --workload "$K/data/$w" --variant kernel
            for b in $BINS; do for v in cm_scalar cm_scanf8; do fast $b $w $v; done; done
          done
          for w in grid_400x3650 grid_2500x3650; do
            run_xclim plain --workload "$K/data/$w" --variant kernel
            for b in $BINS; do for v in cm_lanes8 dm_tiled_256x32; do fast $b $w $v; done; done
            run_xclim plain --workload "$K/data/$w" --variant kernel_threads --threads "$THREADS"
            for b in $BINS; do for v in cm_lanes8_mtp dm_tiled_256x32_mtp; do fast $b $w $v "$THREADS"; done; done
          done
      - name: Run competitors (grids, after the prototypes, same VM)
        run: |
          comp() {  # label, then command
            label=$1; shift
            "$@" --timings out-competitors.jsonl 2>&1 | tail -1 | sed "s/^/[$label] /"
          }
          # per library: what it offers single-threaded, its Dask path (where it has one),
          # and our harness-level thread wrapper on all cores
          for w in grid_400x3650 grid_2500x3650; do
            d="$K/data/$w"
            comp xclim-dask venv/bin/python "$K/xclim/harness.py" --workload "$d" --variant api_dask --threads "$THREADS"
            comp xclim-api venv/bin/python "$K/xclim/harness.py" --workload "$d" --variant api
            comp xarray-spatial venv/bin/python "$K/xarray_spatial/harness.py" --workload "$d" --variant kernel_raster
            comp xarray-spatial-threads venv/bin/python "$K/xarray_spatial/harness.py" --workload "$d" --variant kernel_raster_threads --threads "$THREADS"
            comp firewx bin/firewx --workload "$d" --variant kernel
            comp firewx-mt bin/firewx --workload "$d" --variant kernel_mt
            comp nfdrs4 build-nfdrs4/bench --workload "$d" --variant kernel
            comp nfdrs4-mt build-nfdrs4/bench --workload "$d" --variant kernel_mt --threads "$THREADS"
            comp shipped build-ci/release/kbdi-bench-climate-indices --workload "$d" --variant kernel_mt --threads "$THREADS"
            comp shipped-1t build-ci/release/kbdi-bench-climate-indices --workload "$d" --variant kernel
            for src in repo fast; do
              for v in api api_xarray; do
                comp "ci-$src-$v" "vci-$src/bin/python" "$K/climate_indices_python/bench.py" --workload "$d" --variant $v
              done
              for v in api_dask api_dask_ignore; do
                comp "ci-$src-$v" "vci-$src/bin/python" "$K/climate_indices_python/bench.py" --workload "$d" --variant $v --threads "$THREADS"
              done
            done
          done
      - name: Diagnostics (exp cost per build, output reused)
        run: |
          for b in $BINS; do
            for v in probe_fraction probe_lanes8 cm_lanes8; do
              KBDI_REUSE=1 "$b/release/kbdi-bench-fast" --workload "$K/data/grid_2500x3650" --variant $v --timings out-diag.jsonl 2>&1 | tail -1 | sed "s/^/[$b reuse] /"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.runner }}
          path: "*.jsonl"

  xarray-spatial-dask:
    # xrspatial.kbdi is a one-day step; its Dask path chains 3650 one-day graphs,
    # ~100 s per call, so this runs the harness's --quick protocol (first call,
    # 2 warm-up calls, 3 samples) in its own job
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      K: repo/benchmarks/kbdi_competitors  # make_inputs.py reads the repository's Fresno fixture
      KBDI_NO_CPU_WORKAROUND: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: bench-src
      - uses: actions/checkout@v4
        with:
          repository: monocongo/climate_indices
          ref: main
          path: repo
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Stage
        run: |
          mkdir -p "$K" && cp -r bench-src/bench/. "$K/"
          python -m venv venv
          venv/bin/pip install -q xarray-spatial==0.10.19 numba==0.68.0 llvmlite==0.50.0 numpy==2.4.6 xarray==2026.9.0 pandas==3.0.6 scipy==1.18.1 dask==2026.8.0
          venv/bin/python "$K/make_inputs.py"
      - name: Run (quick protocol)
        run: |
          for w in grid_400x3650 grid_2500x3650; do
            venv/bin/python "$K/xarray_spatial/harness.py" --workload "$K/data/$w" --variant api_raster_dask --threads "$(nproc)" --quick --timings out-xs-dask-quick.jsonl 2>&1 | tail -1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-xs-dask-${{ matrix.runner }}
          path: "*.jsonl"
