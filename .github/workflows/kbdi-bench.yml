name: kbdi-bench
on:
  push:
    branches: [bench/kbdi-ci]
  workflow_dispatch:

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      K: repo/benchmarks/kbdi_competitors
      KBDI_NO_CPU_WORKAROUND: "1"  # the generic-CPU numba workaround is for Snapdragon only
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: bench-src
      - uses: actions/checkout@v4
        with:
          repository: monocongo/climate_indices
          ref: main
          path: repo
          lfs: false
      - name: Hardware
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|Core|Socket|MHz|Flags" | cut -c1-200
          free -g
          echo "THP enabled: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
          echo "THP defrag:  $(cat /sys/kernel/mm/transparent_hugepage/defrag)"
          echo "THREADS=$(nproc)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Stage harnesses and inputs
        run: |
          mkdir -p "$K"
          cp -r bench-src/bench/. "$K/"
          python -m venv venv && venv/bin/pip install -q numpy==2.4.6
          venv/bin/python "$K/make_inputs.py"
          ls "$K/data"
      - name: Build stage-2 prototypes
        run: |
          # default target, as a portable wheel ships it
          cargo build --release --manifest-path "$K/rust_fast/Cargo.toml" --target-dir build
          cargo build --release --manifest-path "$K/rust_fast/Cargo.toml" --target-dir build-mi --features mimalloc
          echo "BINS=build build-mi" >> "$GITHUB_ENV"
      - name: Build AVX2 prototypes (x86 only)
        if: runner.arch == 'X64'
        env:
          # x86-64-v3 = AVX2 (+FMA/BMI); the kernel has no mul_add and Rust never
          # contracts mul+add, so the bits match the baseline build; this is the
          # ceiling of runtime AVX2 dispatch
          RUSTFLAGS: -C target-cpu=x86-64-v3
        run: |
          cargo build --release --manifest-path "$K/rust_fast/Cargo.toml" --target-dir build-v3
          cargo build --release --manifest-path "$K/rust_fast/Cargo.toml" --target-dir build-v3-mi --features mimalloc
          echo "ymm instructions: base $(objdump -d build/release/kbdi-bench-fast | grep -c ymm), v3 $(objdump -d build-v3/release/kbdi-bench-fast | grep -c ymm)"
          echo "BINS=build build-mi build-v3 build-v3-mi" >> "$GITHUB_ENV"
      - name: Install xclim
        run: |
          venv/bin/pip install -q xclim==0.62.0 numba==0.68.0 llvmlite==0.50.0 numpy==2.4.6 xarray==2026.9.0 pandas==3.0.6 scipy==1.18.1 dask==2026.8.0
          venv/bin/python -m numba -s | grep -iE "svml|cpu name|cpu features" || true
      - name: Run
        run: |
          run_xclim() {  # label, then harness args
            label=$1; shift
            venv/bin/python "$K/xclim/harness.py" "$@" --timings "out-$label.jsonl" 2>&1 | tail -1 | sed "s/^/[$label] /"
          }
          fast() {  # build dir, workload, variant, [threads]
            "$1/release/kbdi-bench-fast" --workload "$K/data/$2" --variant "$3" --threads "${4:-1}" --timings "out-$1.jsonl" 2>&1 | tail -1 | sed "s/^/[$1] /"
          }
          for w in station_1825 station_10958; do
            run_xclim plain --workload "$K/data/$w" --variant kernel
            for b in $BINS; do for v in cm_scalar cm_scanf8; do fast $b $w $v; done; done
          done
          for w in grid_400x3650 grid_2500x3650; do
            run_xclim plain --workload "$K/data/$w" --variant kernel
            for b in $BINS; do for v in cm_lanes8 dm_tiled_256x32; do fast $b $w $v; done; done
            run_xclim plain --workload "$K/data/$w" --variant kernel_threads --threads "$THREADS"
            for b in $BINS; do for v in cm_lanes8_mtp dm_tiled_256x32_mtp; do fast $b $w $v "$THREADS"; done; done
          done
      - name: Diagnostics (exp cost per build, output reused)
        run: |
          for b in $BINS; do
            for v in probe_fraction probe_lanes8 cm_lanes8; do
              KBDI_REUSE=1 "$b/release/kbdi-bench-fast" --workload "$K/data/grid_2500x3650" --variant $v --timings out-diag.jsonl 2>&1 | tail -1 | sed "s/^/[$b reuse] /"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.runner }}
          path: "*.jsonl"
